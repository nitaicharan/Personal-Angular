<div class="article-preview">
  <div class="article-meta">
    <a [href]="profileLink">
      <img [src]="profileLink" />
    </a>
    <div class="info">
      <a [href]="profileLink" class="author">{{ authorUsername }}</a>
      <span class="date">{{ articleDate | date: "mediumDate" }}</span>
    </div>
    <button class="btn btn-outline-primary btn-sm pull-xs-right">
      <i class="ion-heart"></i> {{ articleLikes }}
    </button>
  </div>
  <a [href]="articleSlug" class="preview-link">
    <h1>{{ articleTitle }}</h1>
    <p>{{ articleDescription }}</p>
    <span>Read more...</span>
    <ul class="tag-list">
      @for (tag of tags; track tag) {
        <li class="tag-default tag-pill tag-outline">{{ tag }}</li>
      }
    </ul>
  </a>
</div>
